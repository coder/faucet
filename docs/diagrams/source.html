<!doctype html>
<!--
  Source of the README pictures. Each [data-picture] element becomes
  docs/images/<name>-light.png and <name>-dark.png. After an edit, run
  `npm run docs:images` in verify/ and commit the images with this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>faucet pictures</title>
<style>
  :root {
    --bg: #f6f8fa;
    --ink: #1f2328;
    --muted: #424a53;
    --line: #424a53;
    --card: #ffffff;
    --edge: #8c959f;
    --blue: #0969da;
    --blue-fill: #ddf4ff;
    --green: #1a7f37;
    --green-fill: #dafbe1;
    --purple: #8250df;
    --purple-fill: #fbefff;
    --orange: #bc4c00;
    --orange-fill: #fff1e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b22;
      --ink: #f0f6fc;
      --muted: #c3cad3;
      --line: #b1bac4;
      --card: #0d1117;
      --edge: #656c76;
      --blue: #4493f8;
      --blue-fill: #0c2d6b;
      --green: #3fb950;
      --green-fill: #04260f;
      --purple: #ab7df8;
      --purple-fill: #271052;
      --orange: #f0883e;
      --orange-fill: #3d1d00;
    }
  }
  body { margin: 0; padding: 24px; background: #808080; }
  [data-picture] { width: 960px; margin-bottom: 24px; background: var(--bg); }
  svg { display: block; }
  text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 18px; fill: var(--ink); }
  .mono { font-family: Menlo, "DejaVu Sans Mono", monospace; }
  .route { font-family: Menlo, "DejaVu Sans Mono", monospace; font-size: 19px; font-weight: 700; }
  .title { font-size: 28px; font-weight: 700; }
  .big { font-size: 36px; font-weight: 700; }
  .muted { fill: var(--muted); }
  .mid { text-anchor: middle; }
  .halo { paint-order: stroke; stroke: var(--card); stroke-width: 8px; stroke-linejoin: round; }
  .box { stroke-width: 2.5; }
  .plain { fill: var(--card); stroke: var(--ink); }
  .faucet { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 3; }
  .port { fill: var(--card); stroke: var(--blue); stroke-width: 2; }
  .agent { fill: var(--green-fill); stroke: var(--green); }
  .agent-port { fill: var(--card); stroke: var(--green); stroke-width: 2; }
  .db { fill: var(--purple-fill); stroke: var(--purple); }
  .cron { fill: var(--orange-fill); stroke: var(--orange); }
  .card { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
  .wire { fill: none; stroke: var(--line); stroke-width: 2.5; }
  .dashed { stroke-dasharray: 7 6; }
  .lifeline { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 4 6; }
  .head { fill: var(--line); }
  .busy { fill: var(--blue-fill); stroke: var(--blue); stroke-width: 2; }
  .frame { fill: none; stroke: var(--edge); stroke-width: 2; }
  .tab { fill: var(--bg); stroke: var(--edge); stroke-width: 2; }
</style>
</head>
<body>

<div data-picture="map">
<svg width="960" height="582" viewBox="0 0 960 582" role="img" aria-label="How faucet connects GitHub, Postgres, a scheduler and agents">
  <defs>
    <marker id="map-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- faucet and its routes -->
  <rect class="faucet" x="344" y="24" width="312" height="534" rx="18"/>
  <text class="big mid" x="500" y="70">faucet</text>

  <rect class="port" x="360" y="92" width="280" height="68" rx="10"/>
  <text class="route" x="376" y="121">POST /webhook/github</text>
  <text class="muted" x="376" y="147">stores GitHub events</text>

  <rect class="port" x="360" y="174" width="280" height="68" rx="10"/>
  <text class="route" x="376" y="203">GET /cron/redeliver</text>
  <text class="muted" x="376" y="229">asks GitHub to resend</text>

  <rect class="port" x="360" y="256" width="280" height="68" rx="10"/>
  <text class="route" x="376" y="285">GET /cron/purge</text>
  <text class="muted" x="376" y="311">deletes old events</text>

  <rect class="port" x="360" y="338" width="280" height="68" rx="10"/>
  <text class="route" x="376" y="367">GET /cron/deliver</text>
  <text class="muted" x="376" y="393">sends due webhooks</text>

  <rect class="port" x="360" y="420" width="280" height="122" rx="10"/>
  <text class="route" x="376" y="449">POST /mcp</text>
  <text class="mono" x="376" y="477">wait_for_github_events</text>
  <text class="mono" x="376" y="503">events/poll</text>
  <text class="mono" x="376" y="529">events/subscribe</text>

  <!-- GitHub -->
  <rect class="box plain" x="32" y="78" width="240" height="96" rx="14"/>
  <text class="title mid" x="152" y="118">GitHub</text>
  <text class="muted mid" x="152" y="150">org or repo webhook</text>
  <path class="wire" d="M272,126 H358" marker-end="url(#map-head)"/>
  <path class="wire dashed" d="M360,208 H200 V176" marker-end="url(#map-head)"/>

  <!-- Postgres -->
  <path class="box db" d="M748,84 V158 A80,14 0 0 0 908,158 V84"/>
  <ellipse class="box db" cx="828" cy="84" rx="80" ry="14"/>
  <text class="title mid" x="828" y="145">Postgres</text>
  <path class="wire" d="M640,126 H746" marker-end="url(#map-head)"/>

  <!-- scheduler -->
  <rect class="box cron" x="728" y="190" width="200" height="200" rx="14"/>
  <text class="title mid" x="828" y="286">Scheduler</text>
  <text class="muted mid" x="828" y="316">Vercel Cron</text>
  <path class="wire" d="M728,208 H642" marker-end="url(#map-head)"/>
  <path class="wire" d="M728,290 H642" marker-end="url(#map-head)"/>
  <path class="wire" d="M728,372 H642" marker-end="url(#map-head)"/>

  <!-- agent -->
  <rect class="box agent" x="32" y="292" width="240" height="196" rx="14"/>
  <text class="title mid" x="152" y="330">Agent</text>
  <rect class="agent-port" x="52" y="348" width="200" height="48" rx="8"/>
  <text class="mid" x="152" y="378">callback URL</text>
  <rect class="agent-port" x="52" y="419" width="200" height="48" rx="8"/>
  <text class="mid" x="152" y="449">MCP client</text>
  <path class="wire" d="M360,372 H254" marker-end="url(#map-head)"/>
  <path class="wire" d="M252,443 H358" marker-end="url(#map-head)"/>
</svg>
</div>

<div data-picture="ways">
<svg width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Three ways for an agent to get events from faucet: wait, poll and subscribe">
  <defs>
    <marker id="ways-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Wait -->
  <g transform="translate(24 24)">
    <rect class="card" width="288" height="492" rx="16"/>
    <text class="big" x="24" y="52">Wait</text>
    <text class="mono" x="24" y="84">wait_for_github_events</text>
    <rect class="box agent" x="12" y="108" width="88" height="40" rx="8"/>
    <text class="mid" x="56" y="134">agent</text>
    <rect class="box faucet" x="188" y="108" width="88" height="40" rx="8"/>
    <text class="mid" x="232" y="134">faucet</text>
    <path class="lifeline" d="M56,148 V470 M232,148 V470"/>
    <rect class="busy" x="224" y="196" width="16" height="228"/>
    <path class="wire" d="M56,196 H222" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="186">one tool call</text>
    <text class="mid halo" x="140" y="316">waits up to 50 s</text>
    <path class="wire" d="M224,424 H58" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="140" y="414">first match</text>
    <text class="mid halo" x="140" y="448">with a cursor</text>
  </g>

  <!-- Poll -->
  <g transform="translate(336 24)">
    <rect class="card" width="288" height="492" rx="16"/>
    <text class="big" x="24" y="52">Poll</text>
    <text class="mono" x="24" y="84">events/poll</text>
    <rect class="box agent" x="12" y="108" width="88" height="40" rx="8"/>
    <text class="mid" x="56" y="134">agent</text>
    <rect class="box faucet" x="188" y="108" width="88" height="40" rx="8"/>
    <text class="mid" x="232" y="134">faucet</text>
    <path class="lifeline" d="M56,148 V470 M232,148 V470"/>
    <path class="wire" d="M56,196 H230" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="186">cursor</text>
    <path class="wire" d="M232,256 H58" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="246">events, cursor</text>
    <rect class="frame" x="16" y="296" width="256" height="164" rx="10"/>
    <path class="tab" d="M16,306 A10,10 0 0 1 26,296 H130 V318 L118,330 H16 Z"/>
    <text x="26" y="320">call again</text>
    <path class="wire" d="M56,376 H230" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="366">cursor</text>
    <path class="wire" d="M232,436 H58" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="426">events, cursor</text>
  </g>

  <!-- Subscribe -->
  <g transform="translate(648 24)">
    <rect class="card" width="288" height="492" rx="16"/>
    <text class="big" x="24" y="52">Subscribe</text>
    <text class="mono" x="24" y="84">events/subscribe</text>
    <rect class="box agent" x="12" y="108" width="88" height="40" rx="8"/>
    <text class="mid" x="56" y="134">agent</text>
    <rect class="box faucet" x="188" y="108" width="88" height="40" rx="8"/>
    <text class="mid" x="232" y="134">faucet</text>
    <path class="lifeline" d="M56,148 V470 M232,148 V470"/>
    <path class="wire" d="M56,196 H230" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="186">subscribe once</text>
    <rect class="frame" x="16" y="232" width="256" height="170" rx="10"/>
    <path class="tab" d="M16,242 A10,10 0 0 1 26,232 H130 V254 L118,266 H16 Z"/>
    <text x="26" y="256">each event</text>
    <path class="wire" d="M232,316 H58" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="306">signed POST</text>
    <text class="mid halo" x="144" y="340">to your URL</text>
    <text class="mid halo muted" x="144" y="380">Standard Webhooks</text>
    <path class="wire" d="M56,444 H230" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="144" y="434">renew within 10 min</text>
  </g>

</svg>
</div>

</body>
</html>
