<!doctype html>
<!--
  Source of the README pictures. Each [data-picture] element becomes
  docs/images/<name>-light.png and <name>-dark.png. After an edit, run
  `npm run docs:images` in verify/ and commit the images with this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Superblink Events pictures</title>
<style>
  /*
    Colours and type follow the Coder Kit product design system (the
    coder-brand skill's kit/coder-kit.css): zinc neutrals, one accent (the link
    blue) for Superblink Events itself, Geist and Geist Mono. The hsl values are the Kit's
    role tokens, except --edge, zinc-500, which keeps borders and lifelines at
    3:1 against their card in both schemes. fonts/ holds Geist under the SIL
    Open Font License, so every host renders the same glyphs.
  */
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --bg: hsl(240 5% 96%);          /* surface-secondary */
    --card: hsl(0 0% 100%);         /* surface-primary */
    --ink: hsl(240 10% 4%);         /* content-primary */
    --muted: hsl(240 5% 34%);       /* content-secondary */
    --line: hsl(240 5% 34%);        /* content-secondary */
    --edge: hsl(240 4% 46%);        /* zinc-500 */
    --accent: hsl(221 83% 53%);     /* content-link */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(240 6% 10%);
      --card: hsl(240 10% 4%);
      --ink: hsl(0 0% 100%);
      --muted: hsl(240 5% 65%);
      --line: hsl(240 5% 65%);
      --edge: hsl(240 4% 46%);
      --accent: hsl(213 94% 68%);
    }
  }
  body { margin: 0; padding: 24px; background: #808080; }
  [data-picture] { width: 960px; margin-bottom: 24px; background: var(--bg); }
  svg { display: block; }
  text { font-family: "Geist", sans-serif; font-size: 22px; fill: var(--ink); }
  .mono { font-family: "Geist Mono", monospace; font-size: 20px; }
  .route { font-family: "Geist Mono", monospace; font-weight: 600; }
  .title { font-size: 30px; font-weight: 600; }
  .big { font-size: 40px; font-weight: 600; }
  .name { font-size: 32px; font-weight: 600; }
  .small { font-size: 20px; }
  .accent { fill: var(--accent); }
  .muted { fill: var(--muted); }
  .mid { text-anchor: middle; }
  .halo { font-size: 20px; paint-order: stroke; stroke: var(--card); stroke-width: 8px; stroke-linejoin: round; }
  .box { stroke-width: 2.5; }
  .plain { fill: var(--card); stroke: var(--edge); }
  .self { fill: var(--card); stroke: var(--accent); stroke-width: 3; }
  .port { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
  .agent { fill: var(--card); stroke: var(--edge); }
  .agent-port { fill: var(--bg); stroke: var(--edge); stroke-width: 2; }
  .db { fill: var(--card); stroke: var(--edge); }
  .cron { fill: var(--card); stroke: var(--edge); }
  .card { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
  .wire { fill: none; stroke: var(--line); stroke-width: 3; }
  .dashed { stroke-dasharray: 8 7; }
  .lifeline { fill: none; stroke: var(--edge); stroke-width: 2.5; stroke-dasharray: 5 7; }
  .head { fill: var(--line); }
  .busy { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; }
  .frame { fill: none; stroke: var(--edge); stroke-width: 2; }
  .tab { fill: var(--bg); stroke: var(--edge); stroke-width: 2; }
</style>
</head>
<body>

<div data-picture="map">
<svg width="960" height="636" viewBox="0 0 960 636" role="img" aria-label="How Superblink Events connects GitHub, Postgres, a scheduler and agents">
  <defs>
    <marker id="map-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Superblink Events and its routes -->
  <rect class="self" x="324" y="24" width="328" height="588" rx="18"/>
  <text class="name mid accent" x="488" y="72">Superblink Events</text>

  <rect class="port" x="340" y="96" width="296" height="76" rx="10"/>
  <text class="route" x="354" y="128">POST /webhook/github</text>
  <text class="muted" x="354" y="158">stores GitHub events</text>

  <rect class="port" x="340" y="186" width="296" height="76" rx="10"/>
  <text class="route" x="354" y="218">GET /cron/redeliver</text>
  <text class="muted" x="354" y="248">asks GitHub to resend</text>

  <rect class="port" x="340" y="276" width="296" height="76" rx="10"/>
  <text class="route" x="354" y="308">GET /cron/purge</text>
  <text class="muted" x="354" y="338">old events, expired subs</text>

  <rect class="port" x="340" y="366" width="296" height="76" rx="10"/>
  <text class="route" x="354" y="398">GET /cron/deliver</text>
  <text class="muted" x="354" y="428">sends due webhooks</text>

  <rect class="port" x="340" y="456" width="296" height="140" rx="10"/>
  <text class="route" x="354" y="488">POST /github/mcp</text>
  <text class="mono" x="354" y="520">wait_for_github_events</text>
  <text class="mono" x="354" y="548">events/poll</text>
  <text class="mono" x="354" y="576">events/subscribe</text>

  <!-- GitHub -->
  <rect class="box plain" x="24" y="82" width="236" height="104" rx="14"/>
  <text class="title mid" x="142" y="126">GitHub</text>
  <text class="muted mid" x="142" y="162">org or repo webhook</text>
  <path class="wire" d="M260,134 H338" marker-end="url(#map-head)"/>
  <path class="wire dashed" d="M340,224 H170 V189" marker-end="url(#map-head)"/>

  <!-- Postgres -->
  <path class="box db" d="M732,92 V170 A92,16 0 0 0 916,170 V92"/>
  <ellipse class="box db" cx="824" cy="92" rx="92" ry="16"/>
  <text class="title mid" x="824" y="156">Postgres</text>
  <path class="wire" d="M636,134 H729" marker-end="url(#map-head)"/>

  <!-- scheduler -->
  <rect class="box cron" x="712" y="204" width="224" height="220" rx="14"/>
  <text class="title mid" x="824" y="308">Scheduler</text>
  <text class="muted mid" x="824" y="344">Vercel Cron</text>
  <path class="wire" d="M712,224 H638" marker-end="url(#map-head)"/>
  <path class="wire" d="M712,314 H638" marker-end="url(#map-head)"/>
  <path class="wire" d="M712,404 H638" marker-end="url(#map-head)"/>

  <!-- agent -->
  <rect class="box agent" x="24" y="318" width="236" height="206" rx="14"/>
  <text class="title mid" x="142" y="356">Agent</text>
  <rect class="agent-port" x="44" y="380" width="196" height="48" rx="8"/>
  <text class="mid" x="142" y="412">callback URL</text>
  <rect class="agent-port" x="44" y="456" width="196" height="48" rx="8"/>
  <text class="mid" x="142" y="488">MCP client</text>
  <path class="wire" d="M340,404 H242" marker-end="url(#map-head)"/>
  <path class="wire" d="M240,480 H338" marker-end="url(#map-head)"/>
</svg>
</div>

<div data-picture="ways">
<svg width="960" height="552" viewBox="0 0 960 552" role="img" aria-label="Three ways for an agent to get events from Superblink Events: wait, poll and subscribe">
  <defs>
    <marker id="ways-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Wait -->
  <g transform="translate(16 16)">
    <rect class="card" width="296" height="520" rx="16"/>
    <text class="big" x="18" y="56">Wait</text>
    <text class="mono" x="18" y="90">wait_for_github_events</text>
    <rect class="box agent" x="10" y="104" width="80" height="68" rx="8"/>
    <text class="mid" x="50" y="145">agent</text>
    <rect class="box self" x="166" y="104" width="120" height="68" rx="8"/>
    <text class="mid small accent" x="226" y="133">Superblink</text>
    <text class="mid small accent" x="226" y="159">Events</text>
    <path class="lifeline" d="M50,176 V500 M226,176 V500"/>
    <rect class="busy" x="218" y="212" width="16" height="232"/>
    <path class="wire" d="M50,212 H216" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="200">one tool call</text>
    <text class="mid halo" x="138" y="336">waits up to 50 s</text>
    <path class="wire" d="M226,444 H52" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="432">first match</text>
    <text class="mid halo" x="138" y="472">with a cursor</text>
  </g>

  <!-- Poll -->
  <g transform="translate(332 16)">
    <rect class="card" width="296" height="520" rx="16"/>
    <text class="big" x="18" y="56">Poll</text>
    <text class="mono" x="18" y="90">events/poll</text>
    <rect class="box agent" x="10" y="104" width="80" height="68" rx="8"/>
    <text class="mid" x="50" y="145">agent</text>
    <rect class="box self" x="166" y="104" width="120" height="68" rx="8"/>
    <text class="mid small accent" x="226" y="133">Superblink</text>
    <text class="mid small accent" x="226" y="159">Events</text>
    <path class="lifeline" d="M50,176 V500 M226,176 V500"/>
    <path class="wire" d="M50,212 H224" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="200">cursor</text>
    <path class="wire" d="M226,272 H52" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="260">events, cursor</text>
    <rect class="frame" x="12" y="304" width="272" height="188" rx="10"/>
    <path class="tab" d="M12,314 A10,10 0 0 1 22,304 H142 V328 L128,342 H12 Z"/>
    <text x="22" y="331">call again</text>
    <path class="wire" d="M50,396 H224" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="384">cursor</text>
    <path class="wire" d="M226,456 H52" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="444">events, cursor</text>
  </g>

  <!-- Subscribe -->
  <g transform="translate(648 16)">
    <rect class="card" width="296" height="520" rx="16"/>
    <text class="big" x="18" y="56">Subscribe</text>
    <text class="mono" x="18" y="90">events/subscribe</text>
    <rect class="box agent" x="10" y="104" width="80" height="68" rx="8"/>
    <text class="mid" x="50" y="145">agent</text>
    <rect class="box self" x="166" y="104" width="120" height="68" rx="8"/>
    <text class="mid small accent" x="226" y="133">Superblink</text>
    <text class="mid small accent" x="226" y="159">Events</text>
    <path class="lifeline" d="M50,176 V500 M226,176 V500"/>
    <path class="wire" d="M50,212 H224" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="200">subscribe once</text>
    <rect class="frame" x="12" y="244" width="272" height="160" rx="10"/>
    <path class="tab" d="M12,254 A10,10 0 0 1 22,244 H142 V268 L128,282 H12 Z"/>
    <text x="22" y="271">each event</text>
    <path class="wire" d="M226,336 H52" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="324">signed POST</text>
    <text class="mid halo" x="138" y="364">to your URL</text>
    <path class="wire" d="M50,444 H224" marker-end="url(#ways-head)"/>
    <text class="mid halo" x="138" y="432">renew</text>
    <text class="mid halo" x="138" y="472">within 10 min</text>
  </g>

</svg>
</div>

</body>
</html>
