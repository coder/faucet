version: "2"
sql:
  - engine: postgresql
    schema: faucet/pgstore/migrations
    queries: faucet/pgstore/queries
    gen:
      go:
        package: database
        out: faucet/pgstore/database
        sql_package: database/sql
        overrides:
          # A nullable jsonb column scans into []byte, nil for NULL, so the
          # generated code needs no module beyond database/sql.
          - db_type: jsonb
            nullable: true
            go_type:
              type: "[]byte"
